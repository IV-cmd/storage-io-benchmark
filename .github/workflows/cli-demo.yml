name: Capture CLI example

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install release and image dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ cmake ninja-build liburing-dev
          python -m pip install -r requirements.txt
      - name: Build release
        run: make release
      - name: Capture real CLI output and render its image
        run: |
          python - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          import platform
          import shlex
          import subprocess
          import tempfile

          import matplotlib
          matplotlib.use("Agg")
          import matplotlib.pyplot as plt

          output = Path("docs/images")
          output.mkdir(exist_ok=True)
          with tempfile.TemporaryDirectory(dir=os.environ["RUNNER_TEMP"]) as scratch:
              target = str(Path(scratch) / "disposable.data")
              command = ["./build-release/iobench", "--engine", "iouring",
                         "--pattern", "rand", "--op", "read", "--block-size", "4k",
                         "--iodepth", "8", "--file", target, "--file-size", "16m",
                         "--ops", "16384", "--warmup", "0"]
              result = subprocess.run(command, capture_output=True, text=True, check=True)
              assert not result.stderr, result.stderr
              stdout = result.stdout
              metadata = {
                  "run_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
                  "source_commit": os.environ["GITHUB_SHA"],
                  "command": shlex.join(command), "DEMO_FILE": target,
                  "kernel": platform.release(),
                  "mount": subprocess.check_output(
                      ["findmnt", "-T", target, "-o", "SOURCE,FSTYPE,OPTIONS"], text=True),
                  "purpose": "CLI illustration, not a controlled performance comparison",
                  "image": "Terminal-style rendering of the command and unedited stdout, not a live terminal screenshot",
              }
          (output / "cli-run.txt").write_text(stdout)
          (output / "cli-run.json").write_text(json.dumps(metadata, indent=2) + "\n")
          display = ('$ ./build-release/iobench --engine iouring --pattern rand --op read \\\n'
                     '    --block-size 4k --iodepth 8 --file "$DEMO_FILE" --file-size 16m \\\n'
                     '    --ops 16384 --warmup 0\n\n' + stdout)
          figure = plt.figure(figsize=(13, 1.2 + 0.30 * len(display.splitlines())),
                              facecolor="#0d1117")
          figure.text(0.025, 0.95, "iobench | GitHub Actions CLI output",
                      color="#8b949e", family="DejaVu Sans Mono", fontsize=12, va="top")
          figure.text(0.025, 0.86, display, color="#e6edf3", family="DejaVu Sans Mono",
                      fontsize=11, va="top", linespacing=1.5, parse_math=False)
          figure.text(0.025, 0.035, "Real stdout; terminal-style rendering. Not a performance baseline.",
                      color="#8b949e", family="DejaVu Sans Mono", fontsize=10)
          figure.savefig(output / "cli-run.png", dpi=160)
          print(metadata["run_url"])
          print(stdout, end="")
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: cli-example
          path: docs/images/cli-run.*
          if-no-files-found: error
          retention-days: 90
