name: Repeated fio validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install release and validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ cmake ninja-build liburing-dev fio util-linux
      - name: Build release binary
        run: make release
      - name: Compare three alternating pairs per workload
        run: python3 scripts/validate_fio.py ./build-release/iobench "$RUNNER_TEMP"
      - name: Publish comparison
        if: always()
        run: |
          for report in results/validate-*/comparison.md; do
            if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - name: Upload validation evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repeated-fio-validation
          path: results/validate-*/
          retention-days: 90
          if-no-files-found: error
