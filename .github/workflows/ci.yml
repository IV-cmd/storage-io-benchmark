name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      sources:
        description: Optional JSON map of proposed C++ files; format and verify without committing
        type: string
        required: false

permissions:
  contents: read

jobs:
  check:
    name: Build, format, tidy, ASan and UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ cmake ninja-build clang-18 clang-format-18 clang-tidy-18 liburing-dev sysstat fio blktrace util-linux-extra
          sudo apt-get install -y --no-install-recommends linux-tools-$(uname -r) || true
      - name: Format proposed C++ edits
        if: inputs.sources != ''
        env:
          SOURCES: ${{ inputs.sources }}
        run: |
          python3 - <<'PYTHON'
          import json, os, re
          from pathlib import Path
          for name, content in json.loads(os.environ["SOURCES"]).items():
              path = Path(name)
              assert ".." not in path.parts
              assert name == "CMakeLists.txt" or re.fullmatch(r"(?:src|tests)/[a-zA-Z0-9_./-]+\.(?:cc|h)", name)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content)
          PYTHON
          make format
      - name: Upload formatted candidate for committing after checks pass
        if: inputs.sources != ''
        uses: actions/upload-artifact@v4
        with:
          name: formatted-candidate
          path: |
            src/
            tests/
            CMakeLists.txt
      - name: Record storage and ring capabilities
        run: |
          mkdir -p results
          cat > "$RUNNER_TEMP/storage-probe.cc" <<'CPP'
          #include <liburing.h>
          #include <fcntl.h>
          #include <sys/stat.h>
          #include <unistd.h>
          #include <cerrno>
          #include <cstring>
          #include <iostream>
          int main(int argc, char** argv) {
            io_uring ring{};
            const int rc = io_uring_queue_init(32, &ring, 0);
            std::cout << "io_uring_queue_init=" << rc << '\n';
            if (rc == 0) io_uring_queue_exit(&ring);
            for (int i = 1; i < argc; ++i) {
              const int fd = open(argv[i], O_RDWR | O_CREAT | O_EXCL | O_DIRECT, 0600);
              const int error = fd < 0 ? errno : 0;
              std::cout << argv[i] << " O_DIRECT open errno=" << error
                        << " (" << std::strerror(error) << ")\n";
              if (fd < 0) continue;
              struct statx info{};
              const int status = statx(fd, "", AT_EMPTY_PATH, STATX_DIOALIGN, &info);
              std::cout << "statx=" << status << " mask=" << info.stx_mask
                        << " memory_alignment=" << info.stx_dio_mem_align
                        << " offset_alignment=" << info.stx_dio_offset_align << '\n';
              close(fd);
              unlink(argv[i]);
            }
          }
          CPP
          g++ -std=c++20 "$RUNNER_TEMP/storage-probe.cc" -luring -o "$RUNNER_TEMP/storage-probe"
          "$RUNNER_TEMP/storage-probe" "$RUNNER_TEMP/iobench-probe" /dev/shm/iobench-probe | tee results/host-probe.txt
          lsblk -o NAME,TYPE,SIZE,LOG-SEC,PHY-SEC,ROTA,MODEL >> results/host-probe.txt
      - name: Check Python syntax
        run: python3 -m py_compile scripts/plot.py docs/data/collect.py
      - name: Build
        run: make build
      - name: Check formatting
        run: |
          make format-check || { make format; git diff -- src tests; exit 1; }
      - name: Run clang-tidy
        run: make tidy
      - name: Build and test under ASan and UBSan
        run: make test-asan
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      - name: Exercise all engines and CSV output
        run: |
          ./build/iobench --help
          findmnt -T "$RUNNER_TEMP" -o SOURCE,FSTYPE,OPTIONS > results/environment.txt
          uname -a >> results/environment.txt
          cmake -S . -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build-release --parallel 2
          python3 scripts/verify_engines.py ./build-release/iobench "$RUNNER_TEMP"
      - name: Observe page cache and queue depth (not validated performance)
        env:
          LC_ALL: C
          TZ: UTC
        run: python3 scripts/observe_storage.py ./build-release/iobench "$RUNNER_TEMP"
      - name: Cross-check iobench against fio (deltas recorded, not gated)
        run: |
          status=0
          python3 scripts/validate_fio.py ./build-release/iobench "$RUNNER_TEMP" --duration 2 --repeats 1 || status=$?
          cat results/validate-*/comparison.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -eq 3 ]; then
            echo "::warning::fio throughput tolerance missed; see the comparison and evidence artifact"
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi
      - name: Capture iostat, blktrace and perf alongside runs
        run: |
          trap 'sudo -n chown -R "$(id -u):$(id -g)" results' EXIT
          sudo -n env LC_ALL=C PATH="$PATH" python3 scripts/observe_run.py ./build-release/iobench "$RUNNER_TEMP" --duration 2
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-verification
          path: results/
          if-no-files-found: error

  plots:
    name: Reproduce committed plots
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Reproduce committed plots from preserved CSVs
        run: |
          python -m pip install -r requirements.txt
          make plots PLOT_DIR="$RUNNER_TEMP/plots"
          python - <<'PYTHON'
          import os
          import re
          from pathlib import Path
          from matplotlib.testing.compare import compare_images
          output = Path(os.environ["RUNNER_TEMP"]) / "plots"
          expected = sorted(Path("docs/plots").glob("*.png"))
          assert {p.name for p in output.glob("*.png")} == {p.name for p in expected}
          for path in expected:
              difference = compare_images(str(path), str(output / path.name), tol=0.2)
              assert difference is None, difference
              print(path.name, "matches")
          embedded = set(re.findall(r"!\[[^\]]*\]\(([^)]+)\)", Path("README.md").read_text()))
          for path in [*expected, Path("docs/images/cli-run.png")]:
              assert str(path) in embedded, f"{path}: not embedded in README"
          for path in embedded:
              if not path.startswith(("https://", "http://")):
                  assert Path(path).is_file(), f"{path}: missing README image"
          PYTHON
      - name: Preserve regenerated images on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-plots
          path: ${{ runner.temp }}/plots/
