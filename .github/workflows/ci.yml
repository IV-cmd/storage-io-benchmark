name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build, format, tidy, ASan and UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake ninja-build clang-18 clang-format-18 clang-tidy-18
      - name: Build
        run: make build
      - name: Check formatting
        run: make format-check
      - name: Run clang-tidy
        run: make tidy
      - name: Build and test under ASan and UBSan
        run: make test-asan
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      - name: Run the command-line stub
        run: |
          ./build/iobench --help
          ./build/iobench --engine pread --block-size 4k --queue-depth 1 --file "$RUNNER_TEMP/iobench-unused" --runtime 1
          test ! -e "$RUNNER_TEMP/iobench-unused"
